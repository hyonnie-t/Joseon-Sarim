<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사화 시뮬레이션 — 무오·기묘</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="dev-banner" id="devBanner" hidden>미리보기 모드 — 학번/이름 자동 채움 없이, 기록도 저장되지 않아요.</div>

<div id="app">
  <div class="progress-wrap">
    <div class="stage-dots" id="stageDots"></div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel"></div>
  </div>

  <div id="stepArea"></div>

  <div class="nav-row">
    <button type="button" class="nav-btn prev" id="navPrev">← 이전</button>
    <button type="button" class="nav-btn next" id="navNext">다음</button>
  </div>
</div>

<!-- 사료 돋보기 모달 -->
<div id="sourceModal" class="modal-backdrop" hidden>
  <div class="modal-box">
    <button type="button" id="modalClose" class="modal-close" aria-label="닫기">✕</button>
    <div class="modal-kicker">📜 교과서 핵심 사료 돋보기</div>
    <h3 id="modalTitle" class="modal-title"></h3>
    <div id="modalBody"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
